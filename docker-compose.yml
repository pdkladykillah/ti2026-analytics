# ============================================================================
# ti2026-analytics — chạy chung một VPS với project phuongkhanh-travel.
#
# (IP, đường dẫn và tên key nằm trong VPS-DEPLOY-GUIDE.md của repo private bên kia,
#  cố ý KHÔNG nhắc ở đây vì repo này public.)
#
# Tuân theo VPS-DEPLOY-GUIDE.md của project kia:
#   §3  không publish port 80/443, không đặt tên compose là "phuongkhanh"
#   §5B chưa có domain -> Caddy route theo đường dẫn /ti2026/*
#   §7.2 giới hạn log để không đầy đĩa
# ============================================================================

# BẮT BUỘC đặt tên: tên compose project quyết định tên container và volume.
# Để trống sẽ lấy theo tên thư mục và có thể trộn với project đang chạy.
name: ti2026

services:
  app:
    build:
      context: .
      dockerfile: src/Ti2026.Web/Dockerfile
    restart: unless-stopped

    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      - Ti2026__IngestEnabled=true
      - Ti2026__IngestIntervalHours=6
      - Ti2026__IngestToken=${TI2026_INGEST_TOKEN:?Thieu TI2026_INGEST_TOKEN trong .env}

      # API key OpenDota. KHÔNG bắt buộc: thiếu thì chạy bậc miễn phí 3000/ngày, 0.8 req/s.
      # Có thì gỡ trần ngày và nâng nhịp lên 8 req/s. Giá trị nằm trong .env, không vào git.
      - Ti2026__OpenDota__ApiKey=${TI2026_OPENDOTA_API_KEY:-}
      # KHÔNG đặt RequestsPerSecond ở đây. Dòng cũ ghi "=1" và nó ghi đè đúng mặc định 0.8
      # đặt trong code để tránh 429 — hạn mức OpenDota là 60/phút, mà 1 req/s bằng đúng 60/phút.
      # Một giá trị cấu hình ghi đè một quyết định đã được đo là cách âm thầm huỷ bản sửa.

      # dltv chỉ bật sau khi đã kiểm robots.txt (M3, chưa làm)
      - Ti2026__Dltv__Enabled=false

    volumes:
      - app_data:/app/App_Data

      # data/ gắn thẳng từ máy chủ, CHỈ ĐỌC.
      #
      # Không có dòng này thì mọi thay đổi trong data/*.json chỉ có hiệu lực sau một lần build
      # lại image — chấp nhận được với teams.json (sửa vài tháng một lần) nhưng không chấp nhận
      # được với schedule.json: lịch TI đổi giữa giải, và bắt build lại toàn bộ để dời giờ một
      # trận là cách chắc chắn khiến lịch không bao giờ được cập nhật.
      #
      # api/schedule đọc file ở MỖI request nên sửa xong là thấy ngay, không cần khởi động lại.
      # :ro để container không bao giờ ghi đè lên bản trong git.
      - ./data:/app/data:ro

    # expose, KHÔNG dùng ports: — publish ra host sẽ đi vòng qua ufw (bẫy §5C)
    expose:
      - "8080"

    networks:
      - default
      - web

    # Log Docker mặc định không giới hạn dung lượng -> đầy đĩa sau vài tháng (§7.2)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Trần bộ nhớ: VPS không có swap, để container này không kéo sập
    # phuongkhanh-web-1 khi ingest gặp response lớn bất thường.
    mem_limit: 512m

volumes:
  app_data:

networks:
  web:
    external: true
